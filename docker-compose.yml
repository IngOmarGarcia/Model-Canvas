services:
  db:
    image: postgres:16-alpine
    container_name: canvas-bmc-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-canvas}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-canvas}
      POSTGRES_DB: ${POSTGRES_DB:-canvas_bmc}
    ports:
      # El puerto del host es configurable para no chocar con otro Postgres local.
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-canvas} -d ${POSTGRES_DB:-canvas_bmc}']
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
